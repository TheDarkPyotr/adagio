[package]
name = "adagio-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Adagio desktop app — Tauri 2.x shell"

[lib]
name = "adagio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "adagio-desktop"
path = "src/main.rs"

[dependencies]
adagio-core = { path = "../adagio-core" }
adagio-nextcloud = { path = "../adagio-nextcloud" }
adagio-ipc = { path = "../adagio-ipc" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "desktop_lifecycle"
path = "tests/integration/desktop_lifecycle.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
sqlx = { workspace = true }
