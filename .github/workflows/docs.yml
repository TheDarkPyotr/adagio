name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/website/**"
      - ".github/workflows/docs.yml"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

      # Assemble the final gh-pages directory:
      #   /         ← marketing website (docs/website/)
      #   /docs/    ← fumadocs pages (docs-site/out/docs/)
      #   /_next/   ← Next.js static assets (docs-site/out/_next/)
      #   /fonts/   ← handled by next/font/local → inside _next/static/media/
      # out/index.html is intentionally excluded (would overwrite the website).
      - name: Assemble deploy directory
        run: |
          mkdir -p _deploy
          cp -r docs/website/. _deploy/
          cp -r docs-site/out/docs       _deploy/docs
          cp -r docs-site/out/_next      _deploy/_next
          cp    docs-site/out/404.html   _deploy/404.html
          cp    docs-site/out/sitemap.xml _deploy/sitemap.xml 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: gh-pages
          commit_message: "docs: deploy ${{ github.sha }}"
