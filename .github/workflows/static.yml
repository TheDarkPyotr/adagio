name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

      # Assemble final site:
      #   /        ← marketing website  (docs/website/)
      #   /docs/   ← fumadocs pages     (docs-site/out/docs/)
      #   /_next/  ← Next.js JS/CSS     (docs-site/out/_next/)
      # out/index.html (redirect stub) is intentionally excluded
      # so it never overwrites the website's index.html.
      - name: Assemble deploy directory
        run: |
          mkdir -p _deploy
          cp -r docs/website/. _deploy/
          cp -r docs-site/out/docs  _deploy/docs
          cp -r docs-site/out/_next _deploy/_next
          cp    docs-site/out/404.html _deploy/404.html
          cp    docs-site/out/sitemap.xml _deploy/sitemap.xml 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
