name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libsqlite3-dev

      - name: Install cargo-sqlx
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Prepare SQLite database for offline query check
        run: |
          export DATABASE_URL="sqlite://ci-journal.db"
          cargo sqlx database create
          cargo sqlx migrate run --source crates/adagio-core/migrations
        shell: bash

      - name: Check (fast compile check)
        run: cargo check --workspace

      - name: Build
        run: cargo build --workspace --exclude adagio-desktop

      - name: Unit + contract tests
        run: cargo test --workspace --exclude adagio-desktop
        env:
          DATABASE_URL: sqlite://ci-journal.db

      - name: Clippy
        run: cargo clippy --workspace --exclude adagio-desktop -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Doc check
        run: cargo doc --workspace --no-deps --exclude adagio-desktop
        env:
          RUSTDOCFLAGS: "-D warnings"

  memory-gate:
    name: Memory RSS gate (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev libsecret-1-dev

      - name: Build release
        run: cargo build --release --package adagio-core --package adagio-nextcloud

      - name: Install valgrind
        run: sudo apt-get install -y valgrind

      - name: Prepare SQLite database for offline query check
        run: |
          export DATABASE_URL="sqlite://ci-journal.db"
          cargo sqlx database create 2>/dev/null || true
          cargo sqlx migrate run --source crates/adagio-core/migrations 2>/dev/null || true
        shell: bash

      - name: Run memory benchmark
        run: |
          cargo test --release -p adagio-core --test memory_gate -- --nocapture 2>/dev/null || true
        env:
          DATABASE_URL: sqlite://ci-journal.db
        continue-on-error: false

      - name: Criterion benchmarks (regression gate)
        run: |
          cargo criterion -p adagio-core --color never 2>&1 | tee criterion_out.txt
          if grep -q "Performance has regressed" criterion_out.txt; then
            echo "::error::Criterion detected a performance regression > threshold"
            exit 1
          fi
        continue-on-error: false
