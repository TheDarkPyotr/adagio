name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DATABASE_URL: "sqlite://ci-journal.db"

jobs:
  check-and-test:
    name: ${{ matrix.job }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        job: [test]
        include:
          - os: ubuntu-latest
            job: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: crates/adagio-desktop/src-ui/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsecret-1-dev \
            libsqlite3-dev \
            libfuse3-dev \
            pkg-config

      - name: Install UI dependencies
        run: |
          cd crates/adagio-desktop/src-ui
          npm ci

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Prepare SQLite database
        run: |
          sqlx database create
          sqlx migrate run --source crates/adagio-core/migrations
        shell: bash

      - name: Format check
        if: matrix.job == 'lint'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.job == 'lint'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        if: matrix.job == 'test'
        run: cargo test --workspace

      - name: Doc check
        if: matrix.job == 'lint'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
