        <path d="M8 42 C 18 14, 42 14, 52 42" stroke={fill} strokeWidth="3" strokeLinecap="round" fill="none" opacity={strokeOpacity}/>

        <circle cx="52" cy="42" r="5" fill={accent}/>
      </svg>
    );
  }
  return (
    <svg width={s} height={s} viewBox="0 0 60 60" fill="none" style={{ display: 'block' }}>
      <circle cx="11" cy="42" r="7" fill={fill}/>
      <circle cx="49" cy="42" r="7" fill={accent}/>

    </svg>
  );
}

function Swatch({ color, border }) {
  return <div style={{ width: 12, height: 12, borderRadius: 2, background: color, boxShadow: border ? 'inset 0 0 0 1px var(--hairline)' : 'none' }}/>;
}

function AdagioWord({ size = 32, color = 'var(--ink)', weight = 500 }) {

}

  if (kind === 'folder') {
    return (
      <div style={{ position: 'relative', width: 28, height: 22 }}>
        <svg width="28" height="22" viewBox="0 0 28 22" fill="none">
          <path d="M1 4a2 2 0 0 1 2-2h6l2 2h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V4Z" stroke="var(--forest)" strokeWidth="1.4" fill="var(--paper-2)"/>
        </svg>
      </div>
    );
  }
  return (
    <div style={{ position: 'relative', width: 26, height: 30, background: 'var(--paper-2)', border: '1px solid var(--hairline)', borderRadius: 3, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', padding: '3px 0' }}>
      <div style={{ position: 'absolute', top: 0, right: 0, width: 8, height: 8, background: 'var(--cream-2)', borderLeft: '1px solid var(--hairline)', borderBottom: '1px solid var(--hairline)' }}/>
      <div style={{ flex: 1 }}/>
      <div style={{ fontFamily: 'var(--mono)', fontSize: 7, letterSpacing: '0.05em', textAlign: 'center', color: KIND_COLOR[kind] || 'var(--ink-soft)', fontWeight: 600, textTransform: 'uppercase' }}>{kind}</div>
    </div>
  );
}

function StatusDot({ status, share }) {
  if (status === 'sync') return <SpinDot color="var(--clay)" />;
  if (status === 'ok') return <div title="In sync" style={{ width: 14, height: 14, borderRadius: 7, background: 'var(--good)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="check" size={9} color="white" strokeWidth={2.5}/></div>;
  if (status === 'cloud') return <Icon name="cloud" size={16} color="var(--ink-muted)"/>;
  if (status === 'pin') return <div title="Pinned offline" style={{ width: 14, height: 14, borderRadius: 7, background: 'var(--ink)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><Icon name="check" size={9} color="var(--cream)" strokeWidth={2.5}/></div>;
  if (status === 'conflict') return <Icon name="warn" size={16} color="var(--danger)" strokeWidth={1.8}/>;
  return null;
}

function SpinDot({ color }) {
  return (
    <div style={{ width: 14, height: 14, position: 'relative' }} title="Syncing">
      <svg width="14" height="14" viewBox="0 0 14 14" style={{ animation: 'adagio-spin 1.4s linear infinite' }}>
        <circle cx="7" cy="7" r="5.5" stroke={color} strokeOpacity="0.25" strokeWidth="1.6" fill="none"/>
        <path d="M7 1.5a5.5 5.5 0 0 1 5.5 5.5" stroke={color} strokeWidth="1.6" strokeLinecap="round" fill="none"/>
      </svg>
      <style>{`@keyframes adagio-spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

function Chrome({ children, title = '', tab, onTab }) {
  return (
    <div style={{
      width: '100%', height: '100%', background: 'var(--cream)', display: 'flex', flexDirection: 'column',
      fontFamily: 'var(--body)', color: 'var(--ink)', borderRadius: 'inherit', overflow: 'hidden',
    }}>
      <div style={{
        height: 44, flexShrink: 0, display: 'flex', alignItems: 'center', padding: '0 14px 0 18px',
        borderBottom: '1px solid var(--hairline)', background: 'var(--paper)', gap: 14,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <MarkSlur size={18} fill="var(--ink)" accent="var(--clay)" />
          <span style={{ fontFamily: 'var(--body)', fontWeight: 500, fontSize: 16, letterSpacing: '-0.05em' }}>adagio</span>
        </div>
        {tab && (
          <div style={{ display: 'flex', gap: 0, marginLeft: 18, padding: 3, background: 'var(--cream-2)', borderRadius: 'var(--r-pill)' }}>
            {[['files', 'Files'], ['activity', 'Activity']].map(([id, lbl]) => (
              <button key={id} onClick={() => onTab && onTab(id)}
                style={{
                  background: tab === id ? 'var(--cream)' : 'transparent',
                  color: tab === id ? 'var(--ink)' : 'var(--ink-muted)',
                  border: 'none', padding: '5px 14px', borderRadius: 'var(--r-pill)', fontSize: 12.5,
                  cursor: 'pointer', fontWeight: 500, boxShadow: tab === id ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
                }}>{lbl}</button>
            ))}
          </div>
        )}
        <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 14px', background: 'var(--cream-2)',
            borderRadius: 'var(--r-pill)', width: 320, color: 'var(--ink-muted)', fontSize: 13 }}>
            <Icon name="search" size={14} color="var(--ink-muted)" />
            <span>Search files, people, activity…</span>
            <span style={{ marginLeft: 'auto', fontFamily: 'var(--mono)', fontSize: 10, background: 'var(--cream)', padding: '2px 5px', borderRadius: 3 }}>⌘K</span>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--ink-soft)' }}>
          <ChromeBtn><Icon name="bell" size={15} /></ChromeBtn>
          <ChromeBtn onClick={() => window.location.href = 'settings.html'}><Icon name="settings" size={15} /></ChromeBtn>
          <div style={{ width: 26, height: 26, borderRadius: 13, background: 'var(--forest)', color: 'var(--cream)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, marginLeft: 4 }}>S</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 0, marginLeft: 10, paddingLeft: 10, borderLeft: '1px solid var(--hairline)' }}>
            <ChromeBtn><Icon name="min" size={11} strokeWidth={1.8} /></ChromeBtn>
            <ChromeBtn><Icon name="max" size={11} strokeWidth={1.8} /></ChromeBtn>
            <ChromeBtn><Icon name="close" size={11} strokeWidth={1.8} /></ChromeBtn>
          </div>
        </div>
      </div>
      {children}
    </div>
  );
}

function ChromeBtn({ children, onClick }) {
  const [h, setH] = useState(false);
  return (
    <button onClick={onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        width: 28, height: 28, background: h ? 'var(--cream-2)' : 'transparent',
        border: 'none', borderRadius: 6, cursor: 'pointer', color: 'var(--ink-soft)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>{children}</button>
  );
}

function Sidebar({ selected, onSelect, account, onAccount }) {
  return (
    <div style={{ width: 248, flexShrink: 0, background: 'var(--paper)', borderRight: '1px solid var(--hairline)',
      display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <div style={{ padding: '14px 14px 12px' }}>
        <button onClick={() => onAccount && onAccount()} style={{ width: '100%', background: 'var(--cream-2)', border: '1px solid var(--hairline)', borderRadius: 'var(--r-2)', padding: 10, display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', textAlign: 'left' }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: account.color, color: 'var(--cream)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--body)', fontWeight: 600, fontSize: 14, letterSpacing: '-0.04em' }}>{account.initial}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 500, color: 'var(--ink)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{account.name}</div>
            <div style={{ fontSize: 11, color: 'var(--ink-muted)', fontFamily: 'var(--mono)', letterSpacing: '0.02em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{account.host}</div>
          </div>
          <Icon name="caret-down" size={13} color="var(--ink-muted)" />
        </button>
      </div>

      <SidebarSection label="Library">
        <SidebarItem icon="folder" label="All files" badge="3.2k" id="all" selected={selected} onSelect={onSelect} />
        <SidebarItem icon="star" label="Favorites" badge="14" id="fav" selected={selected} onSelect={onSelect} />
        <SidebarItem icon="clock" label="Recent" id="recent" selected={selected} onSelect={onSelect} />
        <SidebarItem icon="people" label="Shared" badge="8" id="shared" selected={selected} onSelect={onSelect} />
        <SidebarItem icon="tag" label="Tagged" id="tags" selected={selected} onSelect={onSelect} />
      </SidebarSection>

      <SidebarSection label="Pinned folders">
        <PinnedFolder name="Brand · Adagio" status="ok" />
        <PinnedFolder name="Engineering" status="ok" />
        <PinnedFolder name="Hiring · 2026" status="sync" />
      </SidebarSection>

      <div style={{ flex: 1 }}/>

      <SyncFooter />
    </div>
  );
}

function SidebarSection({ label, children }) {
  return (
    <div style={{ padding: '4px 10px 8px' }}>
      <div style={{ padding: '6px 8px 8px', fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--ink-muted)' }}>{label}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>{children}</div>
    </div>
  );
}

function SidebarItem({ icon, label, badge, id, selected, onSelect }) {
  const active = selected === id;
  const [h, setH] = useState(false);
  return (
    <button onClick={() => onSelect && onSelect(id)}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: active ? 'var(--cream-2)' : h ? 'color-mix(in srgb, var(--ink) 5%, transparent)' : 'transparent',
        border: 'none', borderRadius: 'var(--r-2)', padding: '7px 9px', display: 'flex', alignItems: 'center',
        gap: 10, fontSize: 13, color: active ? 'var(--ink)' : 'var(--ink-soft)', cursor: 'pointer',
        fontWeight: active ? 500 : 400, textAlign: 'left',
      }}>
      <Icon name={icon} size={15} color={active ? 'var(--clay)' : 'var(--ink-muted)'} />
      <span style={{ flex: 1 }}>{label}</span>
      {badge && <span style={{ fontSize: 10.5, color: 'var(--ink-muted)', fontFamily: 'var(--mono)' }}>{badge}</span>}
    </button>
  );
}

function PinnedFolder({ name, status }) {
  return (
    <div style={{ padding: '6px 9px', display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, color: 'var(--ink-soft)' }}>
      <div style={{ width: 4, height: 4, borderRadius: 2, background: status === 'sync' ? 'var(--clay)' : 'var(--good)' }}/>
      <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{name}</span>
      {status === 'sync' && <SpinDot color="var(--clay)" />}
    </div>
  );
}

function SyncFooter() {
  return (
    <div style={{ padding: '12px 14px', borderTop: '1px solid var(--hairline)', display: 'flex', flexDirection: 'column', gap: 8 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <SpinDot color="var(--clay)" />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 12, color: 'var(--ink)', fontWeight: 500 }}>Syncing 7 files</div>
          <div style={{ fontSize: 11, color: 'var(--ink-muted)', fontFamily: 'var(--mono)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>~ 2.1 MB / 14.6 MB · 38s</div>
        </div>
      </div>
      <div style={{ height: 3, background: 'var(--cream-2)', borderRadius: 2, overflow: 'hidden' }}>
        <div style={{ width: '38%', height: '100%', background: 'var(--clay)' }}/>
      </div>
    </div>
  );
}

const { useState: useS } = React;

function FilesScene({ files, onShare, sourceFilter, miniature }) {
  const [selected, setSel] = useS(2);
  const visible = files;

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: 'var(--cream)' }}>
      <div style={{ height: 52, flexShrink: 0, padding: '0 22px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid var(--hairline)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13 }}>
          <span style={{ color: 'var(--ink-muted)' }}>cloud.sound.studio</span>
          <Icon name="chevron" size={11} color="var(--ink-muted)" />
          <span style={{ color: 'var(--ink-muted)' }}>Sound</span>
          <Icon name="chevron" size={11} color="var(--ink-muted)" />
          <span style={{ color: 'var(--ink)', fontWeight: 600, fontFamily: 'var(--body)', fontSize: 14, letterSpacing: '-0.02em', marginLeft: 4 }}>{sourceFilter === 'fav' ? 'Favorites' : sourceFilter === 'shared' ? 'Shared with me' : 'Sound'}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <FlatBtn icon="plus" label="New" primary />
          <FlatBtn icon="cloud-dl" label="Make available offline" />
          <FlatBtn icon="share" label="Share" onClick={() => onShare && onShare()} />
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '38px 1fr 110px 110px 160px 80px', padding: '12px 22px 12px',
          fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--ink-muted)',
          borderBottom: '1px solid var(--hairline)' }}>
          <span/>
          <span>Name</span>
          <span>Size</span>
          <span>Items</span>
          <span>Modified</span>
          <span style={{ textAlign: 'right' }}>Status</span>
        </div>

        <div style={{ flex: 1, overflowY: 'auto', padding: '4px 0 12px' }}>
          {visible.map((f, i) => (
            <FileRow key={i} file={f} selected={selected === i} onClick={() => setSel(i)} onShare={onShare} />
          ))}
        </div>
      </div>

      <div style={{ height: 32, flexShrink: 0, borderTop: '1px solid var(--hairline)', background: 'var(--paper)',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 20px',
        fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--ink-muted)', letterSpacing: '0.04em' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
          <span>{visible.length} items · {selected !== null ? '1 selected' : 'nothing selected'}</span>
          <span>·</span>
          <span>2.1 GB local · 84.6 GB on cloud</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: 3, background: 'var(--clay)' }}/>
            syncing · ETA 38s
          </span>
          <span>·</span>
          <span>last full sync 11:42</span>
        </div>
      </div>
    </div>
  );
}

function FileRow({ file, selected, onClick, onShare }) {
  const [h, setH] = useS(false);
  return (
    <div onClick={onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        display: 'grid', gridTemplateColumns: '38px 1fr 110px 110px 160px 80px',
        padding: '11px 22px', alignItems: 'center',
        background: selected ? 'var(--paper-2)' : h ? 'color-mix(in srgb, var(--ink) 4%, transparent)' : 'transparent',
        cursor: 'pointer',
        boxShadow: selected ? 'inset 2px 0 0 var(--clay)' : 'none',
        fontSize: 13.5,
      }}>
      <FileGlyph kind={file.kind} status={file.status} />
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
        <span style={{ color: 'var(--ink)', fontWeight: file.kind === 'folder' ? 500 : 400, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{file.name}</span>
        {file.share && (
          <span title={`Shared with ${file.share}`} style={{ display: 'flex', alignItems: 'center', gap: 3, color: 'var(--ink-muted)', fontSize: 11, fontFamily: 'var(--mono)' }}>
            <Icon name="people" size={12} color="var(--ink-muted)" />
            <span>{file.share}</span>
          </span>
        )}
      </div>
      <span style={{ color: 'var(--ink-muted)', fontSize: 12, fontFamily: 'var(--mono)' }}>{file.size}</span>
      <span style={{ color: 'var(--ink-muted)', fontSize: 12, fontFamily: 'var(--mono)' }}>{file.items ? `${file.items}` : '—'}</span>
      <span style={{ color: 'var(--ink-muted)', fontSize: 12 }}>{file.mtime}</span>
      <span style={{ display: 'flex', justifyContent: 'flex-end', alignItems: 'center', gap: 8 }}>
        <StatusDot status={file.status} />
        {(h || selected) && (
          <button onClick={(e) => { e.stopPropagation(); onShare && onShare(); }}
            style={{ background: 'transparent', border: 'none', cursor: 'pointer', padding: 4, color: 'var(--ink-muted)', display: 'flex' }}>
            <Icon name="share" size={14} />
          </button>
        )}
      </span>
    </div>
  );
}

function FlatBtn({ icon, label, primary, onClick }) {
  const [h, setH] = useS(false);
  const style = primary ? {
    background: h ? 'var(--ink-2)' : 'var(--ink)', color: 'var(--cream)', border: 'none',
  } : {
    background: h ? 'var(--paper-2)' : 'transparent', color: 'var(--ink-soft)',
    border: '1px solid var(--hairline)',
  };
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ ...style, padding: '7px 12px', borderRadius: 'var(--r-2)', display: 'flex', alignItems: 'center', gap: 7,
        fontSize: 12.5, cursor: 'pointer', fontWeight: 500 }}>
      <Icon name={icon} size={14} color={primary ? 'var(--cream)' : 'var(--ink-soft)'} />
      <span>{label}</span>
    </button>
  );
}

function NewFileDialog({ onClose }) {
  const [dragActive, setDragActive] = useS(false);
  
  return (
    <div style={{ position: 'absolute', inset: 0, background: 'color-mix(in srgb, var(--ink) 40%, transparent)', backdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 20 }}>
      <div style={{ width: 500, background: 'var(--cream)', border: '1px solid var(--hairline)', borderRadius: 'var(--r-3)', boxShadow: 'var(--shadow-lg)', overflow: 'hidden' }}>
        <div style={{ padding: '20px 24px 18px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid var(--hairline)' }}>
          <div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.2em', textTransform: 'uppercase', color: 'var(--clay)', marginBottom: 6 }}>Create or upload</div>
            <div style={{ fontFamily: 'var(--body)', fontWeight: 500, fontSize: 24, lineHeight: 1.1, letterSpacing: '-0.035em' }}>New item</div>
          </div>
          <button onClick={onClose} style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--ink-muted)' }}>
            <Icon name="x" size={20} />
          </button>
        </div>

        <div style={{ padding: '24px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 24 }}>
            <NewItemBtn icon="folder-plus" label="Folder" desc="Group related files" />
            <NewItemBtn icon="file-plus" label="Markdown" desc="Draft a new document" />
          </div>

          <label style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-muted)', display: 'block', marginBottom: 12 }}>Upload</label>
          <div 
            onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
            onDragLeave={() => setDragActive(false)}
            onDrop={(e) => { e.preventDefault(); setDragActive(false); }}
            style={{ 
              height: 180, border: dragActive ? '2.5px dashed var(--clay)' : '1.5px dashed var(--hairline)', background: dragActive ? 'var(--paper-2)' : 'var(--paper)',
              borderRadius: 'var(--r-3)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12,
              transition: 'all 0.2s', cursor: 'pointer'
            }}
          >
            <div style={{ width: 44, height: 44, borderRadius: 22, background: 'var(--cream-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-soft)' }}>
              <Icon name="upload" size={20} strokeWidth={2} />
            </div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 15, fontWeight: 500 }}>Drop files here</div>
              <div style={{ fontSize: 13, color: 'var(--ink-muted)', marginTop: 4 }}>or click to browse your computer</div>
            </div>
          </div>
        </div>

        <div style={{ padding: '16px 24px', background: 'var(--paper-2)', borderTop: '1px solid var(--hairline)', display: 'flex', justifyContent: 'flex-end', gap: 10 }}>
          <button onClick={onClose} style={{ background: 'transparent', border: '1px solid var(--hairline)', padding: '8px 20px', borderRadius: 'var(--r-pill)', fontSize: 13, cursor: 'pointer' }}>Cancel</button>
          <button style={{ background: 'var(--ink)', color: 'var(--cream)', border: 'none', padding: '8px 24px', borderRadius: 'var(--r-pill)', fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>Upload</button>
        </div>
      </div>
    </div>
  );
}

function NewItemBtn({ icon, label, desc }) {
  const [h, setH] = useS(false);
  return (
    <button 
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ 
        flex: 1, background: h ? 'var(--paper-2)' : 'var(--paper)', border: '1px solid var(--hairline)', borderRadius: 'var(--r-2)', 
        padding: '16px', textAlign: 'left', cursor: 'pointer', display: 'flex', alignItems: 'flex-start', gap: 14, transition: 'all 0.15s'
      }}
    >
      <div style={{ width: 32, height: 32, borderRadius: 8, background: 'var(--cream-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--clay)', flexShrink: 0 }}>
        <Icon name={icon} size={18} strokeWidth={2} />
      </div>
      <div>
        <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink)' }}>{label}</div>
        <div style={{ fontSize: 12, color: 'var(--ink-muted)', marginTop: 2, lineHeight: 1.3 }}>{desc}</div>
      </div>
    </button>
  );
}

function DesktopApp({ scene = 'files' }) {
  const [tab, setTab] = useS('files');
  const [account] = useS(ACCOUNTS[0]);
  const [source, setSource] = useS('all');
  const [newOpen, setNewOpen] = useS(true);

  return (
    <div style={{ width: '100%', height: '100%', position: 'relative', overflow: 'hidden' }}>
      <Chrome tab={tab} onTab={setTab}>
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          <Sidebar selected={source} onSelect={setSource} account={account} />
          <FilesScene files={FILE_TREE['/Sound']} onShare={() => {}} sourceFilter={source} />
        </div>
      </Chrome>
      {newOpen && <NewFileDialog onClose={() => setNewOpen(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DesktopApp />);
</script>
</body>
</html>
